name: Build ALAM Family Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          if [ -f ALAM-Project.zip ]; then
            mkdir -p extracted
            unzip -q ALAM-Project.zip -d extracted
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          elif [ -f build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Android project not found"
            exit 1
          fi

      - name: Add Firebase configuration
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON secret"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"
          printf '%s' "$FIREBASE_JSON" \
            > "$PROJECT_DIR/app/google-services.json"

          python3 -m json.tool \
            "$PROJECT_DIR/app/google-services.json" \
            > /dev/null

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALAM-Family-Control-Pro-v0.5
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
